[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weiss-schwarz-finisher-simulator"
version = "0.5.0"
description = "Monte Carlo simulation engine for Weiss Schwarz TCG finisher sequences, built around a custom DSL for damage occurrences."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Archer" }
]
keywords = ["simulation", "monte-carlo", "tcg", "parser", "dsl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Repository = "https://github.com/Jeff-cell-afk/weiss_schwarz_finisher_simulator"

[tool.setuptools]
package-dir = { "" = "simulateur_v5" }

[tool.setuptools.packages.find]
where = ["simulateur_v5"]
